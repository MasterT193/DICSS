services:
  - type: web
    name: dicss
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements-prod.txt
    startCommand: >-
      sh -c "python -c \"from app import app; from extensions import db; import models; app.app_context().push(); db.create_all(); print('db ready')\" \
      && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
